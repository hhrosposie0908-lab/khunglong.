<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Xem Video 360 Do</title>
    <!-- Nhúng thư viện A-Frame xử lý xoay 360 độ trên điện thoại -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- Gọi chính xác tên file video của bạn -->
        <video id="video-360" src="video360.mp4" autoplay loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <!-- Gắn video vào quả cầu không gian ảo -->
      <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>

      <!-- Camera tự động xoay theo cảm biến điện thoại -->
      <a-camera look-controls></a-camera>
    </a-scene>
  </body>
</html>
