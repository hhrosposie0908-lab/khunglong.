<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Video 360 Khung Long</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <div style="position: fixed; top: 10px; left: 10px; z-index: 999;">
        <button onclick="document.querySelector('#video-360').play(); this.style.display='none';">BẤM VÀO ĐÂY ĐỂ XEM</button>
    </div>

    <a-scene>
      <a-assets>
        <video id="video-360" src="video360.mp4" autoplay loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>
      <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>
      <a-camera look-controls></a-camera>
    </a-scene>
  </body>
</html>
